[package]
name = "kibi_dsp"
version = "0.1.0"
edition = "2024"

[profile.opti-dev]
inherits = "dev"
opt-level = 1

[dependencies]
eframe = { version = "0.34.2", features = ["persistence", "wayland", "x11", "glow"] }
egui = "0.34.2"
egui_plot = "0.35"
cpal = "0.17.3"
fundsp = "0.20.0"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
